[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-calendar"
version = "0.1.0"
description = "Planificador de calendarios escolares basado en restricciones"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
scholar-calendar-example = "scholar_calendar.example:main"
scholar-calendar = "scholar_calendar.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF007"]
